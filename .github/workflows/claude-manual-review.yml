name: Claude Manual Code Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude-review:
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/review')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '/review')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '/review'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # issue_comment events don't carry a PR ref by default (github.ref
          # resolves to the default branch), so without this the review would
          # run against main instead of the PR's actual code.
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number) }}

      - name: Install tclsh (8.6 via apt, 8.4 built from source)
        # The bridge must work on both OrCAD Capture 16.6 (Tcl 8.4) and 17.4
        # (Tcl 8.6) — see README.md. Ubuntu dropped tcl8.4 from its archives,
        # so it's built from the last 8.4 release; apt's tcl8.6 stays the
        # default `tclsh` on PATH, and this adds `tclsh8.4` alongside it
        # (Tcl's own install target never touches the bare `tclsh` name).
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl
          curl -fsSL https://prdownloads.sourceforge.net/tcl/tcl8.4.20-src.tar.gz -o /tmp/tcl8.4.20-src.tar.gz
          tar xzf /tmp/tcl8.4.20-src.tar.gz -C /tmp
          cd /tmp/tcl8.4.20/unix
          ./configure --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # PR number is filled in automatically from the triggering event,
          # so commenting "/review" is enough — no need to type the PR address.
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.issue.number || github.event.pull_request.number }} --comment'
          # A curated --allowed-tools list kept missing commands the review's
          # subagents legitimately need (gh pr checkout, git apply, pytest,
          # tclsh, ad-hoc pipelines...), causing denials on every run. Deny
          # rules still apply in bypassPermissions mode, so block the specific
          # mutating/destructive actions a read-only review has no business
          # doing, instead of trying to enumerate everything it's allowed to
          # do. `gh api` is included because it's a raw REST/GraphQL client
          # that can replicate push/merge/delete via endpoints with no "push"
          # or "merge" in the command text (e.g. PUT contents, PATCH a ref).
          # --append-system-prompt tells the agent to treat denied/missing tool
          # access (its own or a subagent's) as a broken review, not a clean pass.
          claude_args: |
            --permission-mode bypassPermissions
            --disallowedTools "Bash(git push:*),Bash(gh api:*),Bash(gh pr merge:*),Bash(gh pr close:*),Bash(gh pr edit:*),Bash(gh pr reopen:*),Bash(gh release:*),Bash(gh repo edit:*),Bash(gh repo delete:*),Bash(gh repo archive:*),Bash(gh workflow:*),Bash(gh secret:*),Bash(gh variable:*)"
            --append-system-prompt "CI review environment check: if tool calls required for this review — yours or any subagent's, e.g. gh pr diff/view/comment, file reads, or other necessary tools — are being denied due to permission or configuration problems, and this prevents you from actually inspecting the PR diff, CLAUDE.md files, or forming a real judgment, do NOT report 'No issues found.' Treat denied/missing tool access as a review failure, not a clean pass, including when a subagent's response indicates it could not complete its task for this reason. Instead, stop and post a single comment stating: (1) the review could not be completed, (2) the specific tool/permission failures you or your subagents hit, and (3) that someone should check this repo's workflow permissions and claude_args configuration."
          show_full_output: true
