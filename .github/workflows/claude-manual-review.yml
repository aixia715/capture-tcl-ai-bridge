name: Claude Manual Code Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude-review:
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/review')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '/review')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '/review'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # PR number is filled in automatically from the triggering event,
          # so commenting "/review" is enough — no need to type the PR address.
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.issue.number || github.event.pull_request.number }} --comment'
          # The code-review plugin's command frontmatter only pre-authorizes these
          # tools for its top-level agent; the review spawns parallel subagents
          # that don't inherit it, so their gh calls get denied without this.
          # --append-system-prompt tells the agent to treat denied/missing tool
          # access (its own or a subagent's) as a broken review, not a clean pass.
          claude_args: |
            --allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "CI review environment check: if tool calls required for this review — yours or any subagent's, e.g. gh pr diff/view/comment, file reads, or other necessary tools — are being denied due to permission or configuration problems, and this prevents you from actually inspecting the PR diff, CLAUDE.md files, or forming a real judgment, do NOT report 'No issues found.' Treat denied/missing tool access as a review failure, not a clean pass, including when a subagent's response indicates it could not complete its task for this reason. Instead, stop and post a single comment stating: (1) the review could not be completed, (2) the specific tool/permission failures you or your subagents hit, and (3) that someone should check this repo's workflow permissions and claude_args --allowed-tools configuration."
          show_full_output: true
