name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      checks: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Wait for CI to pass
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: 'test'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # A curated --allowed-tools list kept missing commands the review's
          # subagents legitimately need (gh pr checkout, git apply, pytest,
          # tclsh, ad-hoc pipelines...), causing denials on every run. Deny
          # rules still apply in bypassPermissions mode, so block the one
          # action a read-only review has no business doing instead of trying
          # to enumerate everything it's allowed to do.
          # --append-system-prompt tells the agent to treat denied/missing tool
          # access (its own or a subagent's) as a broken review, not a clean pass.
          claude_args: |
            --permission-mode bypassPermissions
            --disallowedTools "Bash(git push:*)"
            --append-system-prompt "CI review environment check: if tool calls required for this review — yours or any subagent's, e.g. gh pr diff/view/comment, file reads, or other necessary tools — are being denied due to permission or configuration problems, and this prevents you from actually inspecting the PR diff, CLAUDE.md files, or forming a real judgment, do NOT report 'No issues found.' Treat denied/missing tool access as a review failure, not a clean pass, including when a subagent's response indicates it could not complete its task for this reason. Instead, stop and post a single comment stating: (1) the review could not be completed, (2) the specific tool/permission failures you or your subagents hit, and (3) that someone should check this repo's workflow permissions and claude_args configuration."
          show_full_output: true
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
